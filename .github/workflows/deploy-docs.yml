on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Deploy Docs
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Install dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/dist
          compression-level: 9
          if-no-files-found: error

      - name: "Deploy with FastFront"
        uses: fastfront-io/deploy-action@v0.0.1
        with:
          folder: './docs/dist'
          environment: ${{ vars.FASTFRONT_DOCS_STAGE }}
          api_key: ${{ secrets.FASTFRONT_DOCS_STAGE_KEY }}
