on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

name: Deploy Chart
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@v7

      - name: "Create deployment folder"
        run: mkdir -p ./build && cp index.yaml ./build && cp index.html ./build && cp artifacthub-repo.yml ./build

      # Runs the image behind fastfront-io/deploy-action@v0.0.1 directly, pinned by digest,
      # because the action references the CLI image by a mutable tag.
      - name: "Deploy with FastFront"
        uses: docker://ghcr.io/fastfront-io/cli@sha256:0f92190924d681d669c60dd1a187cb5ceef82a1f050516ae376c24ecf6d425c7
        with:
          args: deploy ./build ${{ vars.FASTFRONT_CHART_STAGE }} --timeout=10m
        env:
          FASTFRONT_API_KEY: ${{ secrets.FASTFRONT_CHART_STAGE_KEY }}
