on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

name: Deploy
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Deploy with FastFront"
        uses: fastfront-io/deploy-action@v0.0.1
        with:
          folder: './build'
          environment: ${{ vars.FASTFRONT_CHART_STAGE }}
          api_key: ${{ secrets.FASTFRONT_CHART_STAGE_KEY }}
