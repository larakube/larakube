{{- range $i, $value := .Values.worker }}
{{- if dig "autoscaling" "enabled" false $value }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "larakube.fullname" $ }}-worker-{{ $i }}
  labels:
    {{- include "larakube.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "larakube.fullname" $ }}-worker-{{ $i }}
  minReplicas: {{ dig "minReplicas" 1 $value.autoscaling }}
  maxReplicas: {{ required (printf "worker.%s.autoscaling.maxReplicas is required when autoscaling is enabled" $i) $value.autoscaling.maxReplicas }}
  metrics:
    {{- if $value.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $value.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $value.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $value.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
