{{- if .Values.web.traefik.enabled }}
{{- $fullName := include "larakube.fullname" . }}
{{- $apiVersion := include "larakube.traefikApiVersion" . }}
{{- $traefik := .Values.web.traefik }}
{{- if $traefik.compress }}
---
apiVersion: {{ $apiVersion }}
kind: Middleware
metadata:
  name: {{ $fullName }}-traefik-middleware-compress
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  compress:
    minResponseBodyBytes: 1200
{{- end }}
{{- if or $traefik.customRequestHeaders $traefik.customResponseHeaders }}
---
apiVersion: {{ $apiVersion }}
kind: Middleware
metadata:
  name: {{ $fullName }}-traefik-middleware-custom-headers
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  headers:
    {{- with $traefik.customRequestHeaders }}
    customRequestHeaders:
      {{- range $name, $value := . }}
      {{ $name }}: {{ $value | toString | quote }}
      {{- end }}
    {{- end }}
    {{- with $traefik.customResponseHeaders }}
    customResponseHeaders:
      {{- range $name, $value := . }}
      {{ $name }}: {{ $value | toString | quote }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: Middleware
metadata:
  name: {{ $fullName }}-traefik-middleware-permanent-redirect-https
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- if $traefik.basicAuth.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: Middleware
metadata:
  name: {{ $fullName }}-traefik-middleware-basic-auth
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ required "web.traefik.basicAuth.secret is required when basic auth is enabled" $traefik.basicAuth.secret | quote }}
    {{- with $traefik.basicAuth.realm }}
    realm: {{ . | quote }}
    {{- end }}
{{- end }}
{{- range $traefik.domainRedirects }}
---
apiVersion: {{ $apiVersion }}
kind: Middleware
metadata:
  name: {{ $fullName }}-traefik-middleware-domain-redirect-{{ include "larakube.domainSlug" .domain }}
  labels:
    {{- include "larakube.labels" $ | nindent 4 }}
spec:
  redirectRegex:
    regex: {{ printf "^https?://%s/(.*)" (regexQuoteMeta .domain) | quote }}
    replacement: {{ printf "https://%s/${1}" $traefik.domain | quote }}
    permanent: true
{{- end }}
{{- end }}
