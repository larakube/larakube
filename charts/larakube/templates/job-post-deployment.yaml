{{- if .Values.postDeployment.enabled -}}
{{- if not .Values.postDeployment.command }}
{{- fail "postDeployment.command is required when postDeployment is enabled" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "larakube.fullname" . }}-post-deployment
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Runs after the database migration job (hook weight 0).
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.postDeployment.retry }}
  template:
    metadata:
      labels:
        {{- include "larakube.labels" . | nindent 8 }}
        app.kubernetes.io/component: post-deployment
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "larakube.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.postDeployment.command | nindent 12 }}
          {{- with include "larakube.containerEnv" (dict "root" . "env" .Values.postDeployment.env) | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "larakube.fullname" . }}-env
          resources:
            {{- toYaml .Values.postDeployment.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
