{{- if .Values.web.traefik.enabled }}
{{- $fullName := include "larakube.fullname" . }}
{{- $apiVersion := include "larakube.traefikApiVersion" . }}
{{- $tlsSecretName := include "larakube.traefikTlsSecretName" . }}
{{- $traefik := .Values.web.traefik }}
---
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullName }}-traefik-ingress
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ $traefik.domain }}`)
      kind: Rule
      services:
        - name: {{ $fullName }}-web
          port: {{ .Values.service.port }}
      middlewares:
        {{- if or $traefik.customRequestHeaders $traefik.customResponseHeaders }}
        - name: {{ $fullName }}-traefik-middleware-custom-headers
        {{- end }}
        {{- if $traefik.compress }}
        - name: {{ $fullName }}-traefik-middleware-compress
        {{- end }}
        {{- if $traefik.basicAuth.enabled }}
        - name: {{ $fullName }}-traefik-middleware-basic-auth
        {{- end }}
        {{- range $traefik.extraMiddlewares }}
        - name: {{ . }}
        {{- end }}
  tls:
    secretName: {{ $tlsSecretName }}
{{- if and $traefik.basicAuth.enabled $traefik.basicAuth.allowBypassForIpRanges }}
{{- $clientIPs := list }}
{{- range $traefik.basicAuth.allowBypassForIpRanges }}
{{- $clientIPs = append $clientIPs (printf "ClientIP(`%s`)" .) }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullName }}-traefik-ingress-bypass-basic-auth
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    # One ClientIP() per range: Traefik v3 accepts a single IP/CIDR per matcher.
    - match: Host(`{{ $traefik.domain }}`) && ({{ join " || " $clientIPs }})
      kind: Rule
      services:
        - name: {{ $fullName }}-web
          port: {{ .Values.service.port }}
      middlewares:
        {{- if or $traefik.customRequestHeaders $traefik.customResponseHeaders }}
        - name: {{ $fullName }}-traefik-middleware-custom-headers
        {{- end }}
        {{- if $traefik.compress }}
        - name: {{ $fullName }}-traefik-middleware-compress
        {{- end }}
        {{- range $traefik.extraMiddlewares }}
        - name: {{ . }}
        {{- end }}
  tls:
    secretName: {{ $tlsSecretName }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullName }}-traefik-ingress-redirect-to-https
  labels:
    {{- include "larakube.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ $traefik.domain }}`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: {{ $fullName }}-traefik-middleware-permanent-redirect-https
{{- range $traefik.domainRedirects }}
{{- $slug := include "larakube.domainSlug" .domain }}
---
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullName }}-traefik-ingress-https-domain-redirect-{{ $slug }}
  labels:
    {{- include "larakube.labels" $ | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .domain }}`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: {{ $fullName }}-traefik-middleware-domain-redirect-{{ $slug }}
  tls:
    secretName: {{ $tlsSecretName }}
---
apiVersion: {{ $apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullName }}-traefik-ingress-http-domain-redirect-{{ $slug }}
  labels:
    {{- include "larakube.labels" $ | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .domain }}`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: {{ $fullName }}-traefik-middleware-domain-redirect-{{ $slug }}
{{- end }}
{{- end }}
