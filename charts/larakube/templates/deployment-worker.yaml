{{- range $i, $value := .Values.worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "larakube.fullname" $ }}-worker-{{ $i }}
  labels:
    {{- include "larakube.labels" $ | nindent 4 }}
spec:
  {{- if not (dig "autoscaling" "enabled" false $value) }}
  replicas: {{ $value.replicaCount }}
  {{- end }}
  {{- with $value.updateStrategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "larakube.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker-{{ $i }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "larakube.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker-{{ $i }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "larakube.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $value.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $value.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "larakube.containerEnv" (dict "root" $ "env" $value.env) | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "larakube.fullname" $ }}-env
          {{- with $value.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $value.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $value.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (default dict $value.resources) | nindent 12 }}
          {{- with $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
