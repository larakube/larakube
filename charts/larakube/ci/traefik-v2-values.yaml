# Rendered and linted in CI. Traefik v2 CRDs with basic-auth bypass and domain redirects.
image:
  repository: ghcr.io/example/laravel-app
  tag: "1.0.0"

web:
  traefik:
    enabled: true
    version: 2
    domain: app.example.com
    tlsSecretName: app-example-tls
    basicAuth:
      enabled: true
      secret: app-basic-auth
      allowBypassForIpRanges:
        - 10.0.0.0/8
    domainRedirects:
      - domain: www.app.example.com
